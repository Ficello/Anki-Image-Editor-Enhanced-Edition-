<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Editor & Cropper</title>
  <link rel="stylesheet" href="cropper.min.css">
  <style>
    :root {
      --bg-color: #18181b;
      --panel-bg: #202024;
      --card-bg: #27272a;
      --card-hover: #323238;
      --border-color: #3f3f46;
      --text-color: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-active: #1e40af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .header-left, .header-center, .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-info h1 {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.1px;
      white-space: nowrap;
    }

    .badge {
      font-size: 11.5px;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Controls */
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--card-bg);
      padding: 2px 4px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-color);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      line-height: 1.2;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--card-hover);
    }

    .btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .btn-icon {
      padding: 4px 6px;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      padding: 6px 14px;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--card-bg);
      border-color: var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
    }

    .btn-secondary:hover {
      background: var(--card-hover);
    }

    .btn-ghost {
      background: transparent;
      border-color: var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
    }

    .btn-ghost:hover {
      background: var(--card-hover);
      color: var(--text-color);
    }

    /* Tilt slider control */
    .tilt-control {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .tilt-control input[type="range"] {
      width: 70px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .tilt-val {
      font-variant-numeric: tabular-nums;
      min-width: 28px;
      text-align: right;
    }

    /* Filter dropdown */
    .select-control {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11.5px;
      cursor: pointer;
      outline: none;
    }

    /* Main Container */
    main {
      flex: 1;
      position: relative;
      background: #0f0f11;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .img-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #image {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    /* Interactive annotation SVG overlay */
    #annotation-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
    }

    #annotation-svg.interactive {
      pointer-events: auto;
      cursor: crosshair;
    }

    /* Bottom Action Bar */
    footer {
      background: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .footer-left label {
      font-size: 12.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .footer-left input[type="checkbox"] {
      cursor: pointer;
      accent-color: var(--accent);
      width: 14px;
      height: 14px;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Cropper Overrides */
    .cropper-view-box,
    .cropper-face {
      border-radius: 0;
    }
    .cropper-line {
      background-color: var(--accent);
    }
    .cropper-point {
      background-color: #ffffff;
      width: 7px;
      height: 7px;
      border: 1px solid var(--accent);
    }
    .cropper-dashed {
      border-color: rgba(255, 255, 255, 0.35);
    }
    .cropper-bg {
      background-image: repeating-linear-gradient(45deg, #1c1c1f 25%, transparent 25%, transparent 75%, #1c1c1f 75%, #1c1c1f), repeating-linear-gradient(45deg, #1c1c1f 25%, #121214 25%, #121214 75%, #1c1c1f 75%, #1c1c1f);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
    }
  </style>
</head>
<body>

  <header>
    <!-- Left: Title & Mode Tools -->
    <div class="header-left">
      <div class="title-info">
        <h1 id="header-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2v14a2 2 0 0 0 2 2h14"></path>
            <path d="M18 22V8a2 2 0 0 0-2-2H2"></path>
          </svg>
          <span id="txt-header-title">Crop Image</span>
        </h1>
        <span class="badge" id="dim-badge">Dimensions: -- × --</span>
      </div>

      <!-- Main Tools: Crop vs In-Place Quick Annotations -->
      <div class="toolbar-group">
        <button class="btn active" id="tool-crop" data-tool="crop" title="Crop [C]">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v14a2 2 0 0 0 2 2h14"></path><path d="M18 22V8a2 2 0 0 0-2-2H2"></path></svg>
          <span id="txt-tool-crop">Crop</span>
        </button>
        <button class="btn" id="tool-redact" data-tool="redact" title="Redact / Blackout sensitive data [B]">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="14" rx="1"/></svg>
          <span id="txt-tool-redact">Redact</span>
        </button>
        <button class="btn" id="tool-arrow" data-tool="arrow" title="Pointer Arrow [A]">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"></line><polyline points="10 5 19 5 19 14"></polyline></svg>
          <span id="txt-tool-arrow">Arrow</span>
        </button>
        <button class="btn" id="tool-rect" data-tool="rect" title="Focus Rectangle">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1"/></svg>
          <span id="txt-tool-rect">Frame</span>
        </button>
        <button class="btn" id="tool-highlighter" data-tool="highlighter" title="Highlighter">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 11-6 6v3h3l6-6"></path><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"></path></svg>
          <span id="txt-tool-highlighter">Highlight</span>
        </button>
        <button class="btn btn-icon" id="btn-undo" title="Undo annotation (Ctrl+Z)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        </button>
      </div>
    </div>

    <!-- Center: Aspect Ratios & Transform Controls -->
    <div class="header-center">
      <!-- Aspect Ratios -->
      <div class="toolbar-group">
        <button class="btn active" data-ratio="NaN" id="btn-ratio-free">Free</button>
        <button class="btn" data-ratio="1">1:1</button>
        <button class="btn" data-ratio="1.333333">4:3</button>
        <button class="btn" data-ratio="1.777778">16:9</button>
        <button class="btn" data-ratio="1.5">3:2</button>
      </div>

      <!-- Transform Controls -->
      <div class="toolbar-group">
        <button class="btn btn-icon" id="btn-rotate-left" title="Rotate left (-90°) [L]">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        </button>
        <button class="btn btn-icon" id="btn-rotate-right" title="Rotate right (+90°) [R]">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
        </button>
        <button class="btn btn-icon" id="btn-flip-h" title="Flip horizontal [H]">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 7 5 5-5 5V7z"></path><path d="m21 7-5 5 5 5V7z"></path><path d="M12 2v20"></path></svg>
        </button>
        <button class="btn btn-icon" id="btn-flip-v" title="Flip vertical [V]">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 3 5 5 5-5H7z"></path><path d="m7 21 5-5 5 5H7z"></path><path d="M2 12h20"></path></svg>
        </button>
        <button class="btn btn-icon" id="btn-zoom-in" title="Zoom in">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </button>
        <button class="btn btn-icon" id="btn-zoom-out" title="Zoom out">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </button>
        <!-- Distinct Reset Icon (counter-clockwise reload) -->
        <button class="btn btn-icon" id="btn-reset" title="Reset image and crop">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 2v6h6"></path><path d="M21 12A9 9 0 0 0 6 5.3L3 8"></path><path d="M21 22v-6h-6"></path><path d="M3 12a9 9 0 0 0 15 6.7l3-2.7"></path></svg>
        </button>
      </div>

      <!-- Fine tilt slider -->
      <div class="toolbar-group tilt-control" title="Fine rotation adjustment (-45° to +45°)">
        <span id="txt-tilt-label">Tilt:</span>
        <input type="range" id="slider-tilt" min="-45" max="45" step="0.5" value="0">
        <span class="tilt-val" id="val-tilt">0°</span>
      </div>

      <!-- Medical Filter Selector (Invert, Contrast, Grayscale) -->
      <div class="toolbar-group">
        <select class="select-control" id="select-filter" title="Visual Filter (e.g. Invert for X-ray/CT scans)">
          <option value="none">Normal</option>
          <option value="invert">Invert (Negative)</option>
          <option value="high_contrast">High Contrast</option>
          <option value="grayscale">Grayscale</option>
        </select>
      </div>
    </div>

    <!-- Right: Full Editor Button -->
    <div class="header-right">
      <button class="btn btn-secondary" id="btn-open-full-editor" title="Open full vector editor (arrows, text, shapes, drawing)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        <span id="txt-full-editor">Full Editor</span>
      </button>
    </div>
  </header>

  <main>
    <div class="img-container">
      <img id="image" alt="Image to crop">
      <svg id="annotation-svg"></svg>
    </div>
  </main>

  <footer>
    <div class="footer-left">
      <label>
        <input type="checkbox" id="chk-replace-all">
        <span id="txt-chk-replace-all">Replace on all identical cards</span>
      </label>
    </div>
    <div class="footer-right">
      <button class="btn btn-ghost" id="btn-cancel">Cancel (Esc)</button>
      <button class="btn btn-primary" id="btn-save">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span id="txt-btn-save">Save (Enter)</span>
      </button>
    </div>
  </footer>

  <script src="cropper.min.js"></script>
  <script>
    let cropper = null;
    let currentFilename = "cropped_image.png";
    let currentMimeType = "image/png";
    let scaleX = 1;
    let scaleY = 1;
    let baseRotation = 0;
    let fineTilt = 0;
    let currentTool = "crop"; // 'crop', 'redact', 'arrow', 'rect', 'highlighter'
    let currentFilter = "none"; // 'none', 'invert', 'high_contrast', 'grayscale'
    let annotations = []; // Array of drawn annotations on the image
    let isDrawing = false;
    let drawStart = { x: 0, y: 0 };
    let tempAnnotation = null;
    let I18N = {};

    const imgEl = document.getElementById("image");
    const dimBadge = document.getElementById("dim-badge");
    const annotSvg = document.getElementById("annotation-svg");
    const sliderTilt = document.getElementById("slider-tilt");
    const valTilt = document.getElementById("val-tilt");
    const selectFilter = document.getElementById("select-filter");

    window.initCropperLocale = function (translations) {
      if (!translations) return;
      I18N = translations;

      if (I18N.crop_header_title) document.getElementById("txt-header-title").textContent = I18N.crop_header_title;
      if (I18N.crop_window_title) document.title = I18N.crop_window_title;
      if (I18N.ratio_free) document.getElementById("btn-ratio-free").textContent = I18N.ratio_free;
      if (I18N.btn_rotate_left) document.getElementById("btn-rotate-left").title = I18N.btn_rotate_left;
      if (I18N.btn_rotate_right) document.getElementById("btn-rotate-right").title = I18N.btn_rotate_right;
      if (I18N.btn_flip_h) document.getElementById("btn-flip-h").title = I18N.btn_flip_h;
      if (I18N.btn_flip_v) document.getElementById("btn-flip-v").title = I18N.btn_flip_v;
      if (I18N.btn_zoom_in) document.getElementById("btn-zoom-in").title = I18N.btn_zoom_in;
      if (I18N.btn_zoom_out) document.getElementById("btn-zoom-out").title = I18N.btn_zoom_out;
      if (I18N.btn_reset) document.getElementById("btn-reset").title = I18N.btn_reset;
      if (I18N.btn_full_editor_short) document.getElementById("txt-full-editor").textContent = I18N.btn_full_editor_short;
      if (I18N.btn_full_editor_tip) document.getElementById("btn-open-full-editor").title = I18N.btn_full_editor_tip;
      if (I18N.chk_replace_all) document.getElementById("txt-chk-replace-all").textContent = I18N.chk_replace_all;
      if (I18N.btn_cancel) document.getElementById("btn-cancel").textContent = I18N.btn_cancel;
      if (I18N.btn_save) document.getElementById("txt-btn-save").textContent = I18N.btn_save;
      if (I18N.dimensions_initial) dimBadge.textContent = I18N.dimensions_initial;
      if (I18N.tool_crop) document.getElementById("txt-tool-crop").textContent = I18N.tool_crop;
      if (I18N.tool_redact) document.getElementById("txt-tool-redact").textContent = I18N.tool_redact;
      if (I18N.tool_arrow) document.getElementById("txt-tool-arrow").textContent = I18N.tool_arrow;
      if (I18N.tool_rect) document.getElementById("txt-tool-rect").textContent = I18N.tool_rect;
      if (I18N.tool_highlighter) document.getElementById("txt-tool-highlighter").textContent = I18N.tool_highlighter;
      if (I18N.btn_undo) document.getElementById("btn-undo").title = I18N.btn_undo;
      if (I18N.tool_tilt) document.getElementById("txt-tilt-label").textContent = I18N.tool_tilt + ":";
    };

    function formatDimensions(w, h) {
      if (I18N.dimensions_badge) {
        return I18N.dimensions_badge.replace("{w}", w).replace("{h}", h);
      }
      return `Dimensions: ${w} × ${h} px`;
    }

    function initCropper(src, ratio = NaN) {
      if (cropper) cropper.destroy();
      scaleX = 1;
      scaleY = 1;
      baseRotation = 0;
      fineTilt = 0;
      sliderTilt.value = 0;
      valTilt.textContent = "0°";
      annotations = [];
      imgEl.src = src;

      cropper = new Cropper(imgEl, {
        aspectRatio: ratio,
        viewMode: 1,
        dragMode: 'crop',
        autoCropArea: 0.92,
        restore: false,
        guides: true,
        center: true,
        highlight: true,
        cropBoxMovable: true,
        cropBoxResizable: true,
        toggleDragModeOnDblclick: false,
        ready: function () {
          updateDimensions();
          syncAnnotationOverlay();
        },
        crop: function (event) {
          const w = Math.round(event.detail.width);
          const h = Math.round(event.detail.height);
          dimBadge.textContent = formatDimensions(w, h);
          syncAnnotationOverlay();
        },
        zoom: function () {
          setTimeout(syncAnnotationOverlay, 20);
        }
      });
    }

    function updateDimensions() {
      if (!cropper) return;
      const data = cropper.getData();
      dimBadge.textContent = formatDimensions(Math.round(data.width), Math.round(data.height));
    }

    window.loadCropImage = function (dataUrl, filename, mimeType, replaceAllDefault) {
      currentFilename = filename || "image.png";
      currentMimeType = mimeType || (filename && filename.endsWith('.jpg') ? 'image/jpeg' : 'image/png');
      if (typeof replaceAllDefault === "boolean") {
        document.getElementById("chk-replace-all").checked = replaceAllDefault;
      }
      initCropper(dataUrl, NaN);
    };

    // Tool switching: 'crop' vs in-place annotation tools
    const toolButtons = document.querySelectorAll("[data-tool]");
    toolButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        setTool(btn.dataset.tool);
      });
    });

    function setTool(toolName) {
      currentTool = toolName;
      toolButtons.forEach(b => {
        if (b.dataset.tool === toolName) {
          b.classList.add("active");
        } else {
          b.classList.remove("active");
        }
      });

      if (toolName === "crop") {
        annotSvg.classList.remove("interactive");
        if (cropper) {
          cropper.setDragMode('crop');
        }
      } else {
        annotSvg.classList.add("interactive");
        if (cropper) {
          cropper.setDragMode('none');
        }
      }
    }

    // Aspect ratio selector
    document.querySelectorAll("[data-ratio]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("[data-ratio]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const ratio = parseFloat(btn.dataset.ratio);
        if (cropper) {
          cropper.setAspectRatio(ratio);
        }
      });
    });

    // Transformations
    function applyCombinedRotation() {
      if (!cropper) return;
      cropper.rotateTo(baseRotation + fineTilt);
    }

    document.getElementById("btn-rotate-left").addEventListener("click", () => {
      baseRotation -= 90;
      applyCombinedRotation();
    });
    document.getElementById("btn-rotate-right").addEventListener("click", () => {
      baseRotation += 90;
      applyCombinedRotation();
    });
    document.getElementById("btn-flip-h").addEventListener("click", () => {
      if (!cropper) return;
      scaleX = -scaleX;
      cropper.scaleX(scaleX);
    });
    document.getElementById("btn-flip-v").addEventListener("click", () => {
      if (!cropper) return;
      scaleY = -scaleY;
      cropper.scaleY(scaleY);
    });
    document.getElementById("btn-zoom-in").addEventListener("click", () => cropper && cropper.zoom(0.1));
    document.getElementById("btn-zoom-out").addEventListener("click", () => cropper && cropper.zoom(-0.1));

    document.getElementById("btn-reset").addEventListener("click", () => {
      if (!cropper) return;
      scaleX = 1;
      scaleY = 1;
      baseRotation = 0;
      fineTilt = 0;
      sliderTilt.value = 0;
      valTilt.textContent = "0°";
      currentFilter = "none";
      selectFilter.value = "none";
      applyVisualFilter();
      annotations = [];
      cropper.reset();
      updateDimensions();
      syncAnnotationOverlay();
    });

    // Fine tilt slider
    sliderTilt.addEventListener("input", (e) => {
      fineTilt = parseFloat(e.target.value) || 0;
      valTilt.textContent = (fineTilt > 0 ? "+" : "") + fineTilt + "°";
      applyCombinedRotation();
    });

    // Medical visual filter
    selectFilter.addEventListener("change", (e) => {
      currentFilter = e.target.value;
      applyVisualFilter();
    });

    function applyVisualFilter() {
      let filterCss = "none";
      if (currentFilter === "invert") {
        filterCss = "invert(1) hue-rotate(180deg)";
      } else if (currentFilter === "high_contrast") {
        filterCss = "contrast(1.45) brightness(1.05)";
      } else if (currentFilter === "grayscale") {
        filterCss = "grayscale(1)";
      }
      
      const cropperViewBox = document.querySelector(".cropper-view-box img");
      const cropperCanvas = document.querySelector(".cropper-canvas img");
      if (cropperViewBox) cropperViewBox.style.filter = filterCss;
      if (cropperCanvas) cropperCanvas.style.filter = filterCss;
      imgEl.style.filter = filterCss;
    }

    // Annotation overlay drawing logic
    function getCropperImageCoords(clientX, clientY) {
      if (!cropper) return null;
      const cropBox = document.querySelector(".cropper-crop-box");
      if (!cropBox) return null;

      const rect = cropBox.getBoundingClientRect();
      const inBoxX = clientX - rect.left;
      const inBoxY = clientY - rect.top;

      const cropData = cropper.getData();
      const scaleX_ratio = cropData.width / rect.width;
      const scaleY_ratio = cropData.height / rect.height;

      return {
        // Point in natural image coordinate system
        imgX: cropData.x + (inBoxX * scaleX_ratio),
        imgY: cropData.y + (inBoxY * scaleY_ratio)
      };
    }

    annotSvg.addEventListener("mousedown", (e) => {
      if (currentTool === "crop") return;
      const coords = getCropperImageCoords(e.clientX, e.clientY);
      if (!coords) return;

      isDrawing = true;
      drawStart = coords;
      tempAnnotation = {
        tool: currentTool,
        x1: coords.imgX,
        y1: coords.imgY,
        x2: coords.imgX,
        y2: coords.imgY
      };
      renderOverlay();
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDrawing || !tempAnnotation) return;
      const coords = getCropperImageCoords(e.clientX, e.clientY);
      if (!coords) return;

      tempAnnotation.x2 = coords.imgX;
      tempAnnotation.y2 = coords.imgY;
      renderOverlay();
    });

    window.addEventListener("mouseup", () => {
      if (!isDrawing || !tempAnnotation) return;
      isDrawing = false;
      const dx = Math.abs(tempAnnotation.x2 - tempAnnotation.x1);
      const dy = Math.abs(tempAnnotation.y2 - tempAnnotation.y1);
      if (dx > 3 || dy > 3) {
        annotations.push(tempAnnotation);
      }
      tempAnnotation = null;
      renderOverlay();
    });

    document.getElementById("btn-undo").addEventListener("click", () => {
      if (annotations.length > 0) {
        annotations.pop();
        renderOverlay();
      }
    });

    function syncAnnotationOverlay() {
      const container = document.querySelector(".img-container");
      if (!container) return;
      const rect = container.getBoundingClientRect();
      annotSvg.setAttribute("viewBox", `0 0 ${rect.width} ${rect.height}`);
      annotSvg.style.width = rect.width + "px";
      annotSvg.style.height = rect.height + "px";
      renderOverlay();
      applyVisualFilter();
    }

    function imagePointToScreen(imgX, imgY) {
      if (!cropper) return { x: 0, y: 0 };
      const cropBox = document.querySelector(".cropper-crop-box");
      const container = document.querySelector(".img-container");
      if (!cropBox || !container) return { x: 0, y: 0 };

      const boxRect = cropBox.getBoundingClientRect();
      const contRect = container.getBoundingClientRect();
      const cropData = cropper.getData();

      const inBoxX = (imgX - cropData.x) * (boxRect.width / cropData.width);
      const inBoxY = (imgY - cropData.y) * (boxRect.height / cropData.height);

      return {
        x: (boxRect.left - contRect.left) + inBoxX,
        y: (boxRect.top - contRect.top) + inBoxY
      };
    }

    function renderOverlay() {
      annotSvg.innerHTML = "";
      const allToRender = [...annotations];
      if (tempAnnotation) allToRender.push(tempAnnotation);

      allToRender.forEach(ann => {
        const p1 = imagePointToScreen(ann.x1, ann.y1);
        const p2 = imagePointToScreen(ann.x2, ann.y2);

        const minX = Math.min(p1.x, p2.x);
        const minY = Math.min(p1.y, p2.y);
        const w = Math.abs(p2.x - p1.x);
        const h = Math.abs(p2.y - p1.y);

        if (ann.tool === "redact") {
          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.setAttribute("x", minX);
          rect.setAttribute("y", minY);
          rect.setAttribute("width", w);
          rect.setAttribute("height", h);
          rect.setAttribute("fill", "#000000");
          annotSvg.appendChild(rect);
        } else if (ann.tool === "rect") {
          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.setAttribute("x", minX);
          rect.setAttribute("y", minY);
          rect.setAttribute("width", w);
          rect.setAttribute("height", h);
          rect.setAttribute("fill", "none");
          rect.setAttribute("stroke", "#ef4444");
          rect.setAttribute("stroke-width", "3");
          annotSvg.appendChild(rect);
        } else if (ann.tool === "highlighter") {
          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.setAttribute("x", minX);
          rect.setAttribute("y", minY);
          rect.setAttribute("width", w);
          rect.setAttribute("height", h);
          rect.setAttribute("fill", "rgba(250, 204, 21, 0.45)");
          annotSvg.appendChild(rect);
        } else if (ann.tool === "arrow") {
          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", p1.x);
          line.setAttribute("y1", p1.y);
          line.setAttribute("x2", p2.x);
          line.setAttribute("y2", p2.y);
          line.setAttribute("stroke", "#2563eb");
          line.setAttribute("stroke-width", "3");
          annotSvg.appendChild(line);

          // Arrowhead
          const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
          const headLen = 12;
          const a1x = p2.x - headLen * Math.cos(angle - Math.PI / 6);
          const a1y = p2.y - headLen * Math.sin(angle - Math.PI / 6);
          const a2x = p2.x - headLen * Math.cos(angle + Math.PI / 6);
          const a2y = p2.y - headLen * Math.sin(angle + Math.PI / 6);

          const head = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
          head.setAttribute("points", `${p2.x},${p2.y} ${a1x},${a1y} ${a2x},${a2y}`);
          head.setAttribute("fill", "#2563eb");
          annotSvg.appendChild(head);
        }
      });
    }

    // Composite render: draw cropped image + filter + in-place annotations into final canvas
    function renderFinalCanvas() {
      if (!cropper) return null;
      const canvas = cropper.getCroppedCanvas({
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'high'
      });
      if (!canvas) return null;

      const ctx = canvas.getContext('2d');
      const cropData = cropper.getData();

      // 1. Apply visual filter if requested
      if (currentFilter === "invert") {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          d[i] = 255 - d[i];
          d[i+1] = 255 - d[i+1];
          d[i+2] = 255 - d[i+2];
        }
        ctx.putImageData(imgData, 0, 0);
      } else if (currentFilter === "high_contrast") {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data;
        const factor = (259 * (128 + 60)) / (255 * (259 - 60));
        for (let i = 0; i < d.length; i += 4) {
          d[i] = factor * (d[i] - 128) + 128;
          d[i+1] = factor * (d[i+1] - 128) + 128;
          d[i+2] = factor * (d[i+2] - 128) + 128;
        }
        ctx.putImageData(imgData, 0, 0);
      } else if (currentFilter === "grayscale") {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          const v = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
          d[i] = v;
          d[i+1] = v;
          d[i+2] = v;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      // 2. Render all annotations directly onto final canvas
      const strokeScale = Math.max(2, Math.round(canvas.width / 350));
      annotations.forEach(ann => {
        const ax1 = ann.x1 - cropData.x;
        const ay1 = ann.y1 - cropData.y;
        const ax2 = ann.x2 - cropData.x;
        const ay2 = ann.y2 - cropData.y;

        const rx = Math.min(ax1, ax2);
        const ry = Math.min(ay1, ay2);
        const rw = Math.abs(ax2 - ax1);
        const rh = Math.abs(ay2 - ay1);

        if (ann.tool === "redact") {
          ctx.fillStyle = "#000000";
          ctx.fillRect(rx, ry, rw, rh);
        } else if (ann.tool === "rect") {
          ctx.strokeStyle = "#ef4444";
          ctx.lineWidth = strokeScale;
          ctx.strokeRect(rx, ry, rw, rh);
        } else if (ann.tool === "highlighter") {
          ctx.fillStyle = "rgba(250, 204, 21, 0.45)";
          ctx.fillRect(rx, ry, rw, rh);
        } else if (ann.tool === "arrow") {
          ctx.strokeStyle = "#2563eb";
          ctx.fillStyle = "#2563eb";
          ctx.lineWidth = strokeScale;

          ctx.beginPath();
          ctx.moveTo(ax1, ay1);
          ctx.lineTo(ax2, ay2);
          ctx.stroke();

          const angle = Math.atan2(ay2 - ay1, ax2 - ax1);
          const headLen = strokeScale * 4.5;
          ctx.beginPath();
          ctx.moveTo(ax2, ay2);
          ctx.lineTo(ax2 - headLen * Math.cos(angle - Math.PI / 6), ay2 - headLen * Math.sin(angle - Math.PI / 6));
          ctx.lineTo(ax2 - headLen * Math.cos(angle + Math.PI / 6), ay2 - headLen * Math.sin(angle + Math.PI / 6));
          ctx.closePath();
          ctx.fill();
        }
      });

      return canvas;
    }

    // Save & Cancel actions
    function saveCrop() {
      const canvas = renderFinalCanvas();
      if (!canvas) return;

      const outputDataUrl = canvas.toDataURL(currentMimeType, 0.95);
      const replaceAll = document.getElementById("chk-replace-all").checked;

      if (typeof pycmd === "function") {
        pycmd("crop_save:" + JSON.stringify({
          data: outputDataUrl,
          filename: currentFilename,
          replaceAll: replaceAll
        }));
      }
    }

    function cancelCrop() {
      if (typeof pycmd === "function") {
        pycmd("crop_cancel");
      }
    }

    // Switch to Full Vector Editor passing currently cropped/rendered canvas!
    document.getElementById("btn-open-full-editor").addEventListener("click", () => {
      const canvas = renderFinalCanvas();
      const outputDataUrl = canvas ? canvas.toDataURL("image/png") : "";
      if (typeof pycmd === "function") {
        pycmd("crop_open_full_editor:" + JSON.stringify({
          data: outputDataUrl
        }));
      }
    });

    document.getElementById("btn-save").addEventListener("click", saveCrop);
    document.getElementById("btn-cancel").addEventListener("click", cancelCrop);

    // Keyboard Shortcuts
    window.addEventListener("keydown", (e) => {
      // Don't trigger shortcuts if typing inside an input/select
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;

      if (e.key === "Enter") {
        e.preventDefault();
        saveCrop();
      } else if (e.key === "Escape") {
        e.preventDefault();
        cancelCrop();
      } else if (e.key === "z" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        if (annotations.length > 0) {
          annotations.pop();
          renderOverlay();
        }
      } else if (e.key === "r" || e.key === "R") {
        baseRotation += 90;
        applyCombinedRotation();
      } else if (e.key === "l" || e.key === "L") {
        baseRotation -= 90;
        applyCombinedRotation();
      } else if (e.key === "h" || e.key === "H") {
        if (cropper) {
          scaleX = -scaleX;
          cropper.scaleX(scaleX);
        }
      } else if (e.key === "v" || e.key === "V") {
        if (cropper) {
          scaleY = -scaleY;
          cropper.scaleY(scaleY);
        }
      } else if (e.key === "c" || e.key === "C") {
        setTool("crop");
      } else if (e.key === "b" || e.key === "B") {
        setTool("redact");
      } else if (e.key === "a" || e.key === "A") {
        setTool("arrow");
      } else if (e.key === "i" || e.key === "I") {
        currentFilter = currentFilter === "invert" ? "none" : "invert";
        selectFilter.value = currentFilter;
        applyVisualFilter();
      } else if (e.key === "1") {
        document.getElementById("btn-ratio-free").click();
      } else if (e.key === "2") {
        document.querySelector('[data-ratio="1"]').click();
      } else if (e.key === "3") {
        document.querySelector('[data-ratio="1.333333"]').click();
      } else if (e.key === "4") {
        document.querySelector('[data-ratio="1.777778"]').click();
      } else if (e.key === "5") {
        document.querySelector('[data-ratio="1.5"]').click();
      }
    });

    // Signal Python that webview is loaded
    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
    async function signalReady() {
      while (typeof pycmd !== "function") {
        await sleep(50);
      }
      pycmd("crop_ready");
    }
    window.addEventListener("load", signalReady);
  </script>
</body>
</html>
