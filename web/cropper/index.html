<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crop Image</title>
  <link rel="stylesheet" href="cropper.min.css">
  <style>
    :root {
      --bg-color: #1e1e24;
      --panel-bg: #272730;
      --card-bg: #32323e;
      --border-color: #444454;
      --text-color: #f0f0f5;
      --text-muted: #a0a0b0;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --purple-color: #6366f1;
      --purple-hover: #4f46e5;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
      --success-color: #10b981;
      --success-hover: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-info h1 {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.2px;
    }

    .badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      font-variant-numeric: tabular-nums;
    }

    /* Toolbar Controls */
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--card-bg);
      padding: 3px 6px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .btn {
      background: transparent;
      border: none;
      color: var(--text-color);
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .btn.active {
      background: var(--accent-color);
      color: #fff;
    }

    .btn-icon {
      padding: 5px 7px;
    }

    .btn-purple {
      background: var(--purple-color);
      color: #fff;
      padding: 6px 12px;
      font-weight: 500;
      border-radius: 6px;
    }

    .btn-purple:hover {
      background: var(--purple-hover);
    }

    .btn-success {
      background: var(--success-color);
      color: #fff;
      padding: 7px 18px;
      font-weight: 600;
    }

    .btn-success:hover {
      background: var(--success-hover);
    }

    .btn-danger {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 7px 14px;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger-color);
      border-color: var(--danger-color);
    }

    /* Main Container */
    main {
      flex: 1;
      position: relative;
      background: #141418;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .img-container {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 110px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #image {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    /* Bottom Action Bar */
    footer {
      background: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .footer-left label {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .footer-left input[type="checkbox"] {
      cursor: pointer;
      accent-color: var(--accent-color);
      width: 15px;
      height: 15px;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Cropper Overrides */
    .cropper-view-box,
    .cropper-face {
      border-radius: 0;
    }
    .cropper-line {
      background-color: var(--accent-color);
    }
    .cropper-point {
      background-color: #fff;
      width: 8px;
      height: 8px;
      border: 1px solid var(--accent-color);
    }
    .cropper-dashed {
      border-color: rgba(255, 255, 255, 0.4);
    }
    .cropper-bg {
      background-image: repeating-linear-gradient(45deg, #222 25%, transparent 25%, transparent 75%, #222 75%, #222), repeating-linear-gradient(45deg, #222 25%, #181818 25%, #181818 75%, #222 75%, #222);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-info">
      <h1 id="header-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2v14a2 2 0 0 0 2 2h14"></path>
          <path d="M18 22V8a2 2 0 0 0-2-2H2"></path>
        </svg>
        <span id="txt-header-title">Crop Image</span>
      </h1>
      <span class="badge" id="dim-badge">Dimensions: -- × --</span>
    </div>

    <!-- Aspect Ratios -->
    <div class="toolbar-group">
      <button class="btn active" data-ratio="NaN" id="btn-ratio-free">Free</button>
      <button class="btn" data-ratio="1">1:1</button>
      <button class="btn" data-ratio="1.333333">4:3</button>
      <button class="btn" data-ratio="1.777778">16:9</button>
      <button class="btn" data-ratio="1.5">3:2</button>
    </div>

    <!-- Transform & Zoom -->
    <div class="toolbar-group">
      <button class="btn btn-icon" id="btn-rotate-left" title="Rotate left (-90°)">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
      </button>
      <button class="btn btn-icon" id="btn-rotate-right" title="Rotate right (+90°)">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
      </button>
      <button class="btn btn-icon" id="btn-flip-h" title="Flip horizontal">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 7 5 5-5 5V7z"></path><path d="m21 7-5 5 5 5V7z"></path><path d="M12 2v20"></path></svg>
      </button>
      <button class="btn btn-icon" id="btn-flip-v" title="Flip vertical">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 3 5 5 5-5H7z"></path><path d="m7 21 5-5 5 5H7z"></path><path d="M2 12h20"></path></svg>
      </button>
      <button class="btn btn-icon" id="btn-zoom-in" title="Zoom in">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
      </button>
      <button class="btn btn-icon" id="btn-zoom-out" title="Zoom out">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
      </button>
      <button class="btn btn-icon" id="btn-reset" title="Reset">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
      </button>
    </div>

    <!-- Switch to Full Drawing Editor -->
    <div>
      <button class="btn btn-purple" id="btn-open-full-editor" title="Open full vector editor (arrows, text, shapes, drawing)">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        <span id="txt-full-editor">Full Editor (Shapes / Text)</span>
      </button>
    </div>
  </header>

  <main>
    <div class="img-container">
      <img id="image" alt="Image to crop">
    </div>
  </main>

  <footer>
    <div class="footer-left">
      <label>
        <input type="checkbox" id="chk-replace-all">
        <span id="txt-chk-replace-all">Replace on all identical cards</span>
      </label>
    </div>
    <div class="footer-right">
      <button class="btn btn-danger" id="btn-cancel">Cancel (Esc)</button>
      <button class="btn btn-success" id="btn-save">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span id="txt-btn-save">Save (Enter)</span>
      </button>
    </div>
  </footer>

  <script src="cropper.min.js"></script>
  <script>
    let cropper = null;
    let currentFilename = "cropped_image.png";
    let currentMimeType = "image/png";
    let scaleX = 1;
    let scaleY = 1;
    let I18N = {};

    const imgEl = document.getElementById("image");
    const dimBadge = document.getElementById("dim-badge");

    window.initCropperLocale = function (translations) {
      if (!translations) return;
      I18N = translations;

      if (I18N.crop_header_title) {
        document.getElementById("txt-header-title").textContent = I18N.crop_header_title;
        document.title = I18N.crop_window_title || I18N.crop_header_title;
      }
      if (I18N.ratio_free) {
        document.getElementById("btn-ratio-free").textContent = I18N.ratio_free;
      }
      if (I18N.btn_rotate_left) {
        document.getElementById("btn-rotate-left").title = I18N.btn_rotate_left;
      }
      if (I18N.btn_rotate_right) {
        document.getElementById("btn-rotate-right").title = I18N.btn_rotate_right;
      }
      if (I18N.btn_flip_h) {
        document.getElementById("btn-flip-h").title = I18N.btn_flip_h;
      }
      if (I18N.btn_flip_v) {
        document.getElementById("btn-flip-v").title = I18N.btn_flip_v;
      }
      if (I18N.btn_zoom_in) {
        document.getElementById("btn-zoom-in").title = I18N.btn_zoom_in;
      }
      if (I18N.btn_zoom_out) {
        document.getElementById("btn-zoom-out").title = I18N.btn_zoom_out;
      }
      if (I18N.btn_reset) {
        document.getElementById("btn-reset").title = I18N.btn_reset;
      }
      if (I18N.btn_full_editor) {
        document.getElementById("txt-full-editor").textContent = I18N.btn_full_editor;
      }
      if (I18N.btn_full_editor_tip) {
        document.getElementById("btn-open-full-editor").title = I18N.btn_full_editor_tip;
      }
      if (I18N.chk_replace_all) {
        document.getElementById("txt-chk-replace-all").textContent = I18N.chk_replace_all;
      }
      if (I18N.btn_cancel) {
        document.getElementById("btn-cancel").textContent = I18N.btn_cancel;
      }
      if (I18N.btn_save) {
        document.getElementById("txt-btn-save").textContent = I18N.btn_save;
      }
      if (I18N.dimensions_initial) {
        dimBadge.textContent = I18N.dimensions_initial;
      }
    };

    function formatDimensions(w, h) {
      if (I18N.dimensions_badge) {
        return I18N.dimensions_badge.replace("{w}", w).replace("{h}", h);
      }
      return `Dimensions: ${w} × ${h} px`;
    }

    function initCropper(src, ratio = NaN) {
      if (cropper) {
        cropper.destroy();
      }
      scaleX = 1;
      scaleY = 1;
      imgEl.src = src;

      cropper = new Cropper(imgEl, {
        aspectRatio: ratio,
        viewMode: 1,
        dragMode: 'crop',
        autoCropArea: 0.9,
        restore: false,
        guides: true,
        center: true,
        highlight: true,
        cropBoxMovable: true,
        cropBoxResizable: true,
        toggleDragModeOnDblclick: false,
        ready: function () {
          updateDimensions();
        },
        crop: function (event) {
          const w = Math.round(event.detail.width);
          const h = Math.round(event.detail.height);
          dimBadge.textContent = formatDimensions(w, h);
        }
      });
    }

    function updateDimensions() {
      if (!cropper) return;
      const data = cropper.getData();
      dimBadge.textContent = formatDimensions(Math.round(data.width), Math.round(data.height));
    }

    window.loadCropImage = function (dataUrl, filename, mimeType, replaceAllDefault) {
      currentFilename = filename || "image.png";
      currentMimeType = mimeType || (filename && filename.endsWith('.jpg') ? 'image/jpeg' : 'image/png');
      if (typeof replaceAllDefault === "boolean") {
        document.getElementById("chk-replace-all").checked = replaceAllDefault;
      }
      initCropper(dataUrl, NaN);
    };

    // Aspect ratio buttons
    document.querySelectorAll("[data-ratio]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("[data-ratio]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const ratio = parseFloat(btn.dataset.ratio);
        if (cropper) {
          cropper.setAspectRatio(ratio);
        }
      });
    });

    // Transformations
    document.getElementById("btn-rotate-left").addEventListener("click", () => cropper && cropper.rotate(-90));
    document.getElementById("btn-rotate-right").addEventListener("click", () => cropper && cropper.rotate(90));
    document.getElementById("btn-flip-h").addEventListener("click", () => {
      if (!cropper) return;
      scaleX = -scaleX;
      cropper.scaleX(scaleX);
    });
    document.getElementById("btn-flip-v").addEventListener("click", () => {
      if (!cropper) return;
      scaleY = -scaleY;
      cropper.scaleY(scaleY);
    });
    document.getElementById("btn-zoom-in").addEventListener("click", () => cropper && cropper.zoom(0.1));
    document.getElementById("btn-zoom-out").addEventListener("click", () => cropper && cropper.zoom(-0.1));
    document.getElementById("btn-reset").addEventListener("click", () => {
      if (!cropper) return;
      scaleX = 1;
      scaleY = 1;
      cropper.reset();
      updateDimensions();
    });

    // Switch to Full Editor
    document.getElementById("btn-open-full-editor").addEventListener("click", () => {
      if (typeof pycmd === "function") {
        pycmd("crop_open_full_editor");
      }
    });

    // Save & Cancel actions
    function saveCrop() {
      if (!cropper) return;
      const canvas = cropper.getCroppedCanvas({
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'high'
      });
      if (!canvas) return;

      const outputDataUrl = canvas.toDataURL(currentMimeType, 0.95);
      const replaceAll = document.getElementById("chk-replace-all").checked;

      if (typeof pycmd === "function") {
        pycmd("crop_save:" + JSON.stringify({
          data: outputDataUrl,
          filename: currentFilename,
          replaceAll: replaceAll
        }));
      }
    }

    function cancelCrop() {
      if (typeof pycmd === "function") {
        pycmd("crop_cancel");
      }
    }

    document.getElementById("btn-save").addEventListener("click", saveCrop);
    document.getElementById("btn-cancel").addEventListener("click", cancelCrop);

    // Keyboard shortcuts
    window.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        saveCrop();
      } else if (e.key === "Escape") {
        e.preventDefault();
        cancelCrop();
      }
    });

    // Signal Python that webview is loaded
    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
    async function signalReady() {
      while (typeof pycmd !== "function") {
        await sleep(50);
      }
      pycmd("crop_ready");
    }
    window.addEventListener("load", signalReady);
  </script>
</body>
</html>
